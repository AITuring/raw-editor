name: 'Release: Build & Package App'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: automatic-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Increment patch version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Base version '$base_version' is not a stable semantic version." >&2
            exit 1
          fi

          IFS='.' read -r major minor base_patch <<< "$base_version"
          latest_patch="$(
            git tag --list "v${major}.${minor}.*" |
              sed -nE "s/^v${major}\\.${minor}\\.([0-9]+)$/\\1/p" |
              sort -n |
              tail -n 1
          )"

          patch="$base_patch"
          if [[ -n "$latest_patch" ]] && (( latest_patch >= base_patch )); then
            patch=$((latest_patch + 1))
          fi

          version="${major}.${minor}.${patch}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Next release: v$version"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            args: '--bundles nsis'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            asset-prefix: '02'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: ${{ matrix.asset-prefix }}
      app-version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          asset_count=0

          while IFS= read -r -d '' file; do
            relative_path="${file#downloaded-artifacts/}"
            artifact_name="${relative_path%%/*}"
            platform_name="${artifact_name%_artifacts}"
            file_name="${file##*/}"
            safe_file_name="${file_name// /_}"

            cp "$file" "release-assets/${platform_name}_${safe_file_name}"
            asset_count=$((asset_count + 1))
          done < <(find downloaded-artifacts -type f -print0)

          if (( asset_count == 0 )); then
            echo 'No packaged applications were downloaded.' >&2
            exit 1
          fi

          echo "Prepared $asset_count release assets."

      - name: Create and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "RAW Editor v${RELEASE_VERSION}"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
