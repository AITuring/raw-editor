id: io.github.AITuring.RawEditor

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: raw-editor
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network

build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin

modules:
  - name: raw-editor
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/AITuring/raw-editor.git
        branch: main
      - node-sources.json
      - cargo-sources.json

    build-options:
      env:
        CARGO_HOME: /run/build/raw-editor/cargo
        XDG_CACHE_HOME: /run/build/raw-editor/flatpak-node/cache
        npm_config_cache: /run/build/raw-editor/flatpak-node/npm-cache
        npm_config_offline: 'true'
        RAW_EDITOR_ENABLE_AI_RUNTIME: '0'

    build-commands:
      - npm ci --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - npm run tauri -- build --no-bundle

      - install -Dm644 data/io.github.AITuring.RawEditor.metainfo.xml /app/share/metainfo/io.github.AITuring.RawEditor.metainfo.xml
      - install -Dm644 data/io.github.AITuring.RawEditor.desktop /app/share/applications/io.github.AITuring.RawEditor.desktop
      - install -Dm755 src-tauri/target/release/raw-editor /app/bin/raw-editor

      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.AITuring.RawEditor.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.AITuring.RawEditor.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.AITuring.RawEditor.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.AITuring.RawEditor.png

      - mkdir -p "/app/lib/RAW Editor"
      - cp -R src-tauri/resources "/app/lib/RAW Editor/resources"
      - cp -R src-tauri/lensfun_db "/app/lib/RAW Editor/lensfun_db"

      - install -Dm644 LICENSE /app/share/licenses/io.github.AITuring.RawEditor/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/io.github.AITuring.RawEditor/NOTICE
